# Внутренний nginx фронт-контейнера: раздаёт SPA и проксирует /api в бэкенд.
# Внешний nginx домена koordinatorstvo2026.ru шлёт весь трафик сюда (:80).
server {
    listen 80;
    server_name _;
    # видео до 2 ГБ + накладные расходы multipart
    client_max_body_size 2100M;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker DNS — резолвим имя бэкенда динамически
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Загруженные файлы отдаём сами из тома, минуя FastAPI: uvicorn не должен
    # прокачивать через себя десятки мегабайт видео на каждого зрителя.
    # Более длинный префикс выигрывает у location /api/ ниже.
    location /api/uploads/ {
        alias /srv/uploads/;
        sendfile   on;
        tcp_nopush on;
        aio        threads;   # чтение файла не блокирует воркер
        # имена файлов уникальны, содержимое по имени не меняется
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # /api/* — на FastAPI, префикс сохраняем (бэкенд отдаёт роуты под /api)
    location /api/ {
        set $backend koord26-backend;
        proxy_pass         http://$backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # большие видео стримим прямо в бэкенд, не буферизируя на диск nginx
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }

    # у части сборок nginx нет webmanifest в mime.types — задаём тип явно
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA: отдаём файл или откатываемся на index.html (history-режим роутера)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
